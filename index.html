<style>
:root{--bg:#ebe7df;--card:#fff;--line:#e4dfd5;--mut:#8b867c;--txt:#1b1b19;--amber:#e5a93c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Thonburi,system-ui,sans-serif;min-height:100%}
.card{background:var(--card);border-radius:22px}
.pill{background:var(--card);border-radius:999px;padding:.5rem .95rem;font-size:.85rem;display:inline-flex;align-items:center;gap:.5rem;border:1px solid transparent;transition:.15s}
.card .pill{background:#f3efe8}.pill:hover{border-color:var(--line)}
.pill.on,.card .pill.on{background:#1b1b19;color:#fff}
#panel .card{background:var(--soft)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.btn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.55rem 1rem;font-size:.9rem;transition:.15s}.btn:hover{background:var(--soft)}
.btn-p{background:#1b1b19;color:#fff;font-weight:600;border-color:#1b1b19}.btn-p:hover{background:#34342f}
.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;color:var(--txt)}
.inp:focus,.btn:focus-visible,.pill:focus-visible,.tab:focus-visible,.kp button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.bar{height:6px;border-radius:99px;background:#ece7de;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;transition:width .35s}
.row{display:block;width:100%;text-align:left}.mut{color:var(--mut)}
#modal,#txModal{position:fixed;inset:0;background:#0006;display:none;justify-content:center;overflow:auto;z-index:20}
#modal{align-items:flex-start;padding:1rem}#txModal{align-items:flex-end}
#txModal .seg{display:grid;grid-template-columns:repeat(3,1fr)}
#txModal .sheet{margin-top:auto;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#modal.open,#txModal.open{display:flex}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-width:576px;padding:.9rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:999px;padding:4px}
.seg button{border-radius:999px;padding:.55rem;font-size:.9rem}.seg button.on{background:#1b1b19;color:#fff}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kp button{background:var(--card);border-radius:16px;height:52px;font-size:1.35rem}.kp button:active{background:#f0ebe1}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px #0001;padding:.55rem .5rem calc(.55rem + env(safe-area-inset-bottom,0px))}
#tabs>div{max-width:576px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:#9a958a;padding:.2rem 0}.tab.on{color:#1b1b19;font-weight:600}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#fab{width:56px;height:56px;border-radius:50%;background:var(--amber);color:#1b1b19;font-size:2rem;line-height:1;margin:-30px auto 0;box-shadow:0 8px 20px #e5a93c66}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#1b1b19;color:#fff;padding:.6rem 1rem;border-radius:999px;font-size:.85rem;z-index:30;display:none}
.app{max-width:576px;margin:0 auto;padding:1.5rem 1rem 9rem}
.dash{display:grid;gap:1rem;grid-template-columns:1fr;align-items:start}
.fabl{display:none}
/* iPad / tablet */
@media (min-width:768px){
  .app{max-width:880px;padding:2rem 1.5rem 9rem}
  .dash{grid-template-columns:1fr 1fr}
  #tabs>div{max-width:880px}
  #txModal{align-items:center;padding:1rem}.sheet{border-radius:28px;max-width:480px}
  #toast{bottom:120px}
}
/* PC / desktop: sidebar layout */
@media (min-width:1024px){
  body{padding-left:230px}
  .app{max-width:1120px;padding:2.25rem 2.5rem 3rem}
  #netBig{font-size:3.5rem}
  #tabs{top:0;right:auto;width:230px;border-radius:0;box-shadow:1px 0 0 var(--line);padding:1.75rem 1rem}
  #tabs>div{grid-template-columns:1fr;gap:.25rem;max-width:none;align-items:stretch;align-content:start}
  .tab{flex-direction:row;gap:.75rem;font-size:.95rem;padding:.7rem .9rem;border-radius:14px;justify-content:flex-start}
  .tab:hover{background:var(--soft)}.tab.on{background:#f3efe8}
  #fab{order:-1;width:100%;height:auto;border-radius:16px;margin:0 0 1.25rem;padding:.8rem;font-size:1rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:.5rem;box-shadow:none}
  #fab span:first-child{font-size:1.4rem;line-height:1}
  .fabl{display:inline}
  #v-act{display:grid;grid-template-columns:340px 1fr;column-gap:2rem;align-content:start;align-items:start}
  #v-act>*{grid-column:1}
  #v-act>#aList{grid-column:2;grid-row:1/span 4}
  #toast{bottom:2rem}
}
/* ---- neutral fintech look ---- */
:root{--bg:#ececec;--line:#f0f0f0;--mut:#8e8e93;--txt:#111}
.card{border-radius:20px;box-shadow:0 1px 2px #0000000d,0 8px 24px #0000000a}

.card .pill{background:var(--soft2)}.pill.on,.card .pill.on{background:#111;color:#fff}
.btn-p{background:#111;border-color:#111}.inp{background:#f4f4f4}.bar{background:#e8e8e8}
.gcard{background:linear-gradient(135deg,#3b5a3c 0%,#1d1f1f 40%,#161819 68%,#27364a 100%);color:#fff;border-radius:24px;padding:1.25rem 1.25rem 1.1rem;box-shadow:0 10px 30px #0003}
.segb{height:10px;border-radius:6px;background:repeating-linear-gradient(90deg,#d9d9d9 0 3px,transparent 3px 7px);overflow:hidden}.segb i{display:block;height:100%}

/* floating pill nav */

#tabs>div{grid-template-columns:repeat(5,1fr);gap:4px;align-items:stretch;max-width:none}
.tab{padding:.55rem 0;border-radius:26px;gap:3px;justify-content:center}.tab:hover{background:transparent}
.tab.on{background:#ececec;color:#111;font-weight:600}

@media (min-width:768px){#tabs{left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100% - 24px))}}
@media (min-width:1024px){

/* ---- extra features ---- */
#gModal{position:fixed;inset:0;background:#0006;display:none;justify-content:center;align-items:flex-end;overflow:auto;z-index:20}
#gModal.open{display:flex}
@media (min-width:768px){#gModal{align-items:center;padding:1rem}}
.shg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.shc{aspect-ratio:1;border-radius:12px;font-size:.9rem;font-weight:500}

/* ---- refined typography ---- */
body{font-weight:400;line-height:1.55;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
h1,h2,h3{letter-spacing:-.015em}

.text-2xl,.text-xl{letter-spacing:-.02em}
.mut{font-weight:400;letter-spacing:.005em}
.btn,.pill,.tab{font-weight:500;letter-spacing:0}

/* ---- theme tokens (light / dark) ---- */
:root{--soft:#f6f6f6;--soft2:#f2f2f2;--inv:#111;--invt:#fff}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f0f10;--card:#1b1b1d;--line:#2c2c30;--mut:#9a9aa0;--txt:#f2f2f2;--soft:#242427;--soft2:#2e2e32;--inv:#f2f2f2;--invt:#111}
:root[data-theme=dark] .card{box-shadow:0 0 0 1px #ffffff0d}
.pill.on,.card .pill.on,.seg button.on{background:var(--inv);color:var(--invt)}
.btn{color:var(--txt)}.btn-p,.btn-p:hover{background:var(--inv);color:var(--invt);border-color:var(--inv)}.btn-p:hover{opacity:.88}
.inp{background:var(--soft)}.bar{background:var(--soft2)}
.tab.on{background:var(--soft2);color:var(--txt)}

.kp button{color:var(--txt)}.kp button:active{background:var(--soft2)}
#toast{background:var(--inv);color:var(--invt)}
.inp:disabled{opacity:.45}
[data-tedit]{cursor:pointer}[data-tedit]:hover{box-shadow:0 0 0 1px var(--line),0 8px 24px #0000000a}

/* ===== Mono luxe theme ===== */
:root{--bg:#f6f6f4;--card:#fff;--line:#ececea;--mut:#8d8d8a;--txt:#141414;--soft:#f4f4f2;--soft2:#ececea;--inv:#141414;--invt:#fff;--amber:#141414;--up:#1f9d63;--down:#d6453d;--t-beige:#f1ede5;--t-mint:#e7efe4;--t-lav:#f0e7f0}

body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Thonburi,system-ui,sans-serif;font-weight:400;letter-spacing:-.005em}
.card,:root[data-theme=dark] .card{border-radius:16px;box-shadow:none}
#panel .card{background:var(--soft)}
.font-semibold{font-weight:500!important}
#netBig,.text-5xl,.text-4xl,.text-3xl{font-weight:300!important;letter-spacing:-.035em}
.text-2xl,.text-xl{font-weight:400!important;letter-spacing:-.02em}
h2.text-2xl{font-weight:500!important}
.btn{border-radius:12px;font-weight:400}.btn-p{font-weight:500}
.pill{font-weight:400}.pill.on,.card .pill.on{font-weight:500}

.hb:hover{color:var(--txt)}.hb.on{background:var(--card);color:var(--txt);font-weight:500}

.bar{height:5px}

.seg{background:transparent!important;border-radius:0;padding:0;border-bottom:1px solid var(--line)}
.seg button,.seg button.on{border-radius:0;padding:.7rem .5rem;background:transparent!important;color:var(--mut);border-bottom:1.5px solid transparent;margin-bottom:-1px;font-weight:400}
.seg button.on{color:var(--txt);border-bottom-color:var(--txt);font-weight:500}
/* stat cards */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{display:flex;flex-direction:column;align-items:stretch;text-align:left;border-radius:16px;padding:14px 14px 12px;min-height:158px;color:var(--txt);transition:transform .15s}
.sc:active{transform:scale(.98)}
.sc.blk{background:var(--inv);color:var(--invt)}.sc.bei{background:var(--t-beige)}.sc.min{background:var(--t-mint)}.sc.lav{background:var(--t-lav)}

.sc-a svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sc-v{font-size:1.5rem;font-weight:300;letter-spacing:-.035em;margin-top:16px;line-height:1.15;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.bdg{font-size:.68rem;font-weight:500;letter-spacing:0}

.sc-s{font-size:.7rem;opacity:.55;margin-top:3px;min-height:1rem;line-height:1.3}
.spk{width:100%;height:34px;margin-top:auto;padding-top:8px;overflow:visible}
/* quick actions */
.qrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

}
/* ===== v4: theme system ===== */
:root{--pri:#141414;--pri-t:#fff;--hero:#141414;--hero-t:#fff;--hero-ink:#141414;--bg2:#f6f6f4;--kick:var(--pri);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Thonburi,system-ui,sans-serif;--r:16px;--shadow:none;--c1:#141414;--c2:#8f8f8f;--c3:#bdb6a8;--c4:#5a5a5a;--c5:#c9c9c9;--c6:#7d766b;--c7:#e0dbd2;--warn:#f5a524}

:root[data-theme=mint]{color-scheme:light;--bg:#e8f6f1;--bg2:#bfe8dc;--card:#ffffff;--line:#e1efea;--mut:#7d958f;--txt:#29433d;--soft:#f1f9f6;--soft2:#e2f2ec;--pri:#2fb59a;--pri-t:#fff;--inv:#2fb59a;--invt:#fff;--amber:#2fb59a;--hero:linear-gradient(135deg,#62d4b8 0%,#36b4a1 55%,#2a9a9a 100%);--hero-t:#fff;--hero-ink:#2a9a9a;--up:#1fae73;--down:#f0645a;--t-beige:#fff3d1;--t-mint:#d9f4ea;--t-lav:#e9e4ff;--c1:#2fb59a;--c2:#ff8a73;--c3:#ffc75a;--c4:#6fa8ff;--c5:#b28bff;--c6:#ff7eb3;--c7:#8bd16a;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Thonburi,system-ui,sans-serif;--r:22px;--shadow:0 6px 18px rgba(46,120,105,.08)}
:root[data-theme=midnight]{color-scheme:dark;--bg:#05070d;--bg2:#0b1630;--card:#15171e;--line:#252a36;--mut:#8b92a3;--txt:#f3f5f9;--soft:#1c1f28;--soft2:#262a35;--pri:#2f80ff;--pri-t:#fff;--inv:#2f80ff;--invt:#fff;--amber:#2f80ff;--kick:#5ac8fa;--hero:linear-gradient(135deg,#1f52b0 0%,#13285c 55%,#2c1d4a 100%);--hero-t:#fff;--hero-ink:#1f52b0;--up:#34d399;--down:#ff5b52;--t-beige:#1b2233;--t-mint:#13261f;--t-lav:#221a35;--c1:#2f80ff;--c2:#5ac8fa;--c3:#ffb020;--c4:#ff5b8a;--c5:#a78bfa;--c6:#34d399;--c7:#f472b6;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Thonburi,system-ui,sans-serif;--r:20px;--shadow:0 0 0 1px #ffffff12}
:root[data-theme=sakura]{color-scheme:light;
  --pastel-pink:#f9cdd8;--pastel-pink-deep:#f2a8bb;--thai-tea:#e07a2e;--thai-tea-soft:#f6b479;--milk-cream:#fff6ec;--dark-brown:#4a2e22;
  --bg:var(--milk-cream);--bg2:#fde3e9;--card:#fffdf9;--line:#f2e2d4;--mut:#9a7b6b;--txt:var(--dark-brown);--soft:#fff1e3;--soft2:#fbe5d4;
  --pri:var(--thai-tea);--pri-t:#fff;--inv:var(--thai-tea);--invt:#fff;--amber:var(--thai-tea);--kick:var(--thai-tea);

  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Thonburi,system-ui,sans-serif;--r:22px;--shadow:0 6px 20px rgba(150,90,50,.08)}

:root[data-theme=sunny]{color-scheme:light;--bg:#fff7e2;--bg2:#ffe3a1;--card:#fff;--line:#f5e8c5;--mut:#a08b5d;--txt:#4a3a17;--soft:#fffaf0;--soft2:#fdf0cf;--pri:#ff9f1c;--pri-t:#fff;--inv:#ff9f1c;--invt:#fff;--amber:#ff9f1c;--kick:#e98a00;--hero:linear-gradient(135deg,#ffd166 0%,#ffb048 55%,#ff8f3c 100%);--hero-t:#fff;--hero-ink:#ff8f3c;--up:#2e9e5b;--down:#ec5353;--t-beige:#fff0c2;--t-mint:#e3f6d8;--t-lav:#ffe3d6;--c1:#ff9f1c;--c2:#ff6b6b;--c3:#4ecdc4;--c4:#7b8cff;--c5:#ffd166;--c6:#9ad15a;--c7:#c48aff;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Thonburi,system-ui,sans-serif;--r:22px;--shadow:0 6px 18px rgba(170,120,20,.09)}

body,:root[data-theme] body{font-family:var(--font);background:var(--bg) linear-gradient(180deg,var(--bg2) 0,var(--bg) 340px) no-repeat}
.card,:root[data-theme=dark] .card,:root[data-theme] .card{border-radius:var(--r);box-shadow:var(--shadow)}

.seg button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tab.on{color:var(--pri)}
.hb.on{color:var(--pri)}
.sc.blk{background:var(--hero);color:var(--hero-t)}

:root[data-theme=mono] .sc.blk .bdg,:root[data-theme=dark] .sc.blk .bdg{background:transparent}
.qb i{box-shadow:var(--shadow);color:var(--pri)}
.inp{border-radius:12px}
#fab{background:var(--pri);color:var(--pri-t)}
/* overlays */
.ov{position:fixed;inset:0;background:#0007;display:none;justify-content:center;align-items:flex-end;z-index:25}.ov.open{display:flex}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet{background:var(--bg)}
/* page headings */
.pgT{font-size:1.75rem;font-weight:700;letter-spacing:-.01em;margin:0 0 14px}
.kick{font-size:.7rem;letter-spacing:.16em;font-weight:700;color:var(--kick);text-transform:uppercase;margin-left:2px}
.secT{font-size:1.2rem;font-weight:600}

/* hero (spent today) */
.actTop{display:grid;gap:18px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-t);border-radius:calc(var(--r) + 4px);padding:18px 18px 16px;box-shadow:0 12px 30px -12px color-mix(in srgb,var(--hero-ink) 70%,transparent)}

/* v7: holdings manager follows the theme */
#modal{background:#0007}
#modal>.card{background:var(--bg);border-radius:calc(var(--r) + 4px)}
#modal .inp{background:var(--card);border-color:var(--line)}
#modal hr{border-color:var(--line)!important}
#mList>div{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
#mList .btn{background:var(--soft);border-color:transparent;padding:.4rem .8rem}
#mList .btn[data-delcat],#mList .btn[data-del]{color:var(--down)}
#reset{background:transparent;border-color:var(--line);color:var(--mut)}

/* v8: cute home */
.hiH{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hiT{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hiS{font-size:.88rem;color:var(--mut);margin-top:2px}
.mascot{width:54px;height:54px;border-radius:18px;background:var(--t-beige);display:grid;place-items:center;flex:none;box-shadow:var(--shadow);transition:transform .2s}
.mascot:hover{transform:rotate(-6deg) scale(1.04)}.mascot svg{width:42px;height:42px}
.mascot.sm{width:46px;height:46px;border-radius:15px}.mascot.sm svg{width:36px;height:36px}
.ieRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ieC{text-align:left;border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s}
.ieC:active{transform:scale(.98)}
.ieC.ex{background:color-mix(in srgb,var(--down) 13%,var(--card))}.ieC.in{background:color-mix(in srgb,var(--up) 13%,var(--card))}
.ieL{font-size:.85rem;font-weight:600}.ieC.ex .ieL{color:var(--down)}.ieC.in .ieL{color:var(--up)}
.ieV{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ieV i{font-style:normal;font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 6px}
.ieS{font-size:.75rem;color:var(--mut);margin-top:2px}
.miniRow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.miC{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.miC em{font-style:normal;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:1.15rem;background:var(--t-beige);flex:none}
.miC span{display:block;font-size:.72rem;color:var(--mut)}.miC b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cC{padding:16px}
.cardT{font-size:1.14rem;font-weight:700;letter-spacing:-.01em}
.chipS{font-size:.75rem;border-radius:99px;padding:.25rem .7rem;background:var(--soft2);color:var(--mut);white-space:nowrap}
.spWrap{display:flex;align-items:center;gap:16px;margin-top:10px}
.spDon{position:relative;width:132px;height:132px;flex:none}.spDon canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
@media (min-width:768px){.spDon{width:170px;height:170px}.spWrap{gap:36px;justify-content:center}.spLeg{max-width:380px}}
.spCtr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.spCtr b{font-size:1.1rem;font-weight:700}.spCtr span{font-size:.72rem;color:var(--mut)}
.spLeg{flex:1;min-width:0;display:grid;gap:7px;font-size:.82rem}
.spLeg li{display:grid;grid-template-columns:11px minmax(0,1fr) auto 30px;gap:6px;align-items:center}
.spLeg li i{width:11px;height:11px;border-radius:4px}
.spLeg li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spLeg li b{font-weight:600;white-space:nowrap}.spLeg li em{font-style:normal;color:var(--mut);text-align:right;font-size:.75rem}
.spEmpty{display:flex;align-items:center;gap:12px;padding:18px 4px 6px;color:var(--mut);font-size:.9rem}
.rtC .grp{box-shadow:none;background:transparent;border-radius:0;margin:0 -16px -6px}
.cheer{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--up) 12%,var(--card));box-shadow:var(--shadow)}
.cheer.warm{background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.cheer .lf{font-size:1.6rem}.cheer b{display:block;font-weight:700}.cheer small{display:block;font-size:.78rem;color:var(--mut)}
.cheer .mascot{width:52px;height:52px;margin-left:auto;background:transparent;box-shadow:none}
.stRows{padding:4px 14px}.stR{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}.stR+.stR{border-top:1px solid var(--line)}
.segP{display:inline-flex;background:var(--soft2);border-radius:99px;padding:3px;gap:2px}
.segP button,.segP.one{border-radius:99px;padding:.35rem .8rem;font-size:.82rem;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.segP button.on{background:var(--card);color:var(--txt);font-weight:600;box-shadow:0 1px 3px #0001}
.segP.one{background:var(--soft2);color:var(--txt)}
.stSheet{max-height:92vh;overflow:auto}
/* centre + in the bottom bar (phone / iPad) */
@media (max-width:1023px){
  #tabs>div{grid-template-columns:repeat(5,1fr)!important;align-items:end}
  #fab{display:grid!important;place-items:center;width:56px;height:56px;border-radius:50%;margin:-28px auto 2px;background:var(--pri);color:var(--pri-t);font-size:2rem;line-height:1;box-shadow:0 10px 22px -6px color-mix(in srgb,var(--pri) 75%,transparent),0 0 0 5px var(--card)}
  #fab .fabl{display:none}
  .fabM{display:none!important}
  #tabs{border-radius:24px 24px 0 0}
}

.dash>.card>.relative{max-width:250px!important}@media (min-width:768px){.dash>.card>.relative{max-width:320px!important}}

/* v9: one-screen home */
.hmGrid{display:flex;flex-direction:column;gap:12px;height:100%}
#v-home{display:block}

.hmHero::after{content:"";position:absolute;right:-36px;top:-46px;width:150px;height:150px;border-radius:50%;background:#ffffff22;pointer-events:none}
.hhL{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.92rem;opacity:.92;position:relative}

.hhV{font-size:2.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:4px;position:relative}
.hhS{font-size:.75rem;opacity:.8;position:relative}
.alBar{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:10px 0 6px;background:#ffffff40;gap:2px;position:relative}

async function refreshS(){

      if(!r.ok)throw 0;const d=await r.json();if(d&&d.c>0)x.price=d.c;

let TXs=(()=>{try{const d=JSON.parse(localStorage.getItem('assetDash.tx'));if(Array.isArray(d))return d}catch(e){}return[]})();

function sums(m){const L=TXs.filter(x=>x.date.startsWith(m));return{L,I:L.filter(x=>x.type==='in').reduce((a,x)=>a+x.amt,0),E:L.filter(x=>x.type==='ex').reduce((a,x)=>a+x.amt,0)}}
function io(m,month){const{I,E}=sums(m),mx=Math.max(I,E,1);
  const c=(l,v,col)=>`<div class="card p-4"><div class="mut text-xs">${l}</div><div class="text-xl font-semibold mt-1">${M(v)}</div><div class="bar mt-2"><i style="width:${pct(v,mx)};background:${col}"></i></div></div>`;
  const n=I-E,col=n>=0?'#2a8a5c':'#c0392b';
  const net=`<div class="card p-4" style="grid-column:1/-1"><div class="mut text-xs">${month?t('netFlowM'):t('netFlow')}</div><div class="text-3xl font-semibold mt-1" style="color:${col}">${n<0?'−':'+'}${M(Math.abs(n))}</div><div class="mut text-xs mt-1">${M(I)} − ${M(E)}</div></div>`;
  return net+c(month?t('inM'):t('inc'),I,GRN)+c(month?t('outM'):t('exp'),E,AMB)}
function dl(d){const n=today();if(d===n)return t('tdy');const y=new Date();y.setDate(y.getDate()-1);if(d===ymd(y))return t('yday');

  $('trGrid').innerHTML=h;
  const wr=S_.W.length+S_.Ls.length?Math.round(S_.W.length/(S_.W.length+S_.Ls.length)*100):0,pf=S_.sl?(S_.sw/-S_.sl).toFixed(2):(S_.sw?'∞':'—');

  $('trSum').innerHTML=box(t('trNet'),S_.L.length?SG(S_.net):'—',S_.L.length?PC(S_.net):'',S_.L.length?`${t('trWin')} ${S_.W.length} · ${t('trLoss')} ${S_.Ls.length} · ${t('trRate')} ${wr}% · PF ${pf}`:t('trEmpty'),1)

      scales:{x:{grid:{display:false},ticks:{color:'#8e8e93'}},y:{ticks:{color:'#8e8e93',callback:v=>HID?'':Number(v).toLocaleString('en-US')},grid:{color:cv('--line')}}}}})}

const IDB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open('assetDash',1);r.onupgradeneeded=()=>r.result.createObjectStore('slips');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('slips',mode),st=tx.objectStore('slips'),r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}));
  return{put:(k,v)=>run('readwrite',st=>st.put(v,k)),get:k=>run('readonly',st=>st.get(k)),del:k=>run('readwrite',st=>st.delete(k)).catch(()=>{})}})();

const AH_STYLES=['stack','rows','semi','tiles'];
function ahStyle(){const s=LS('assetDash.allocStyle','stack');return AH_STYLES.includes(s)?s:'stack'}

function ahBtns(){const s=ahStyle();document.querySelectorAll('[data-ast]').forEach(b=>b.classList.toggle('on',b.dataset.ast===s))}
function ahInk(c){const m=/^#([0-9a-f]{6})$/i.exec(c||'');if(!m)return '#fffaf0';const n=parseInt(m[1],16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))>150?'#1f1b16':'#fffaf0'}
function ahNeg(x){return x.cat.neg?' class="ahNeg"':''}
function ahSign(x){return x.cat.neg?'−':''}
function ahLegend(it,T){return `<ul class="ahLeg">${it.map(x=>`<li><i style="background:${x.c}"></i><div class="ahLg"><span class="ahNm">${esc(nm(x.cat))}</span><span class="ahSub"><b${ahNeg(x)}>${ahSign(x)}${M(x.v)}</b><em>${pct(x.v,T)}</em></span></div></li>`).join('')}</ul>`}
function ahHead(T){return `<div class="ahHead"><span>${t(adj()?'costT':'net')}</span><b>${M(adj()?costT():T)}</b></div>`}
function ahSemiSVG(it){const C=2*Math.PI*42,H=C/2,TT=addUp(it.map(x=>x.v))||1;let off=0;
  const segs=it.map(x=>{const L=x.v/TT*H;const s=`<circle cx="50" cy="50" r="42" fill="none" stroke="${x.c}" stroke-width="15" stroke-dasharray="${Math.max(0,L-1).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;off+=L;return s}).join('');
  return `<svg viewBox="0 0 100 54" aria-hidden="true"><g transform="rotate(180 50 50)"><circle cx="50" cy="50" r="42" fill="none" style="stroke:var(--soft2)" stroke-width="15" stroke-dasharray="${H.toFixed(2)} ${C.toFixed(2)}"/>${segs}</g></svg>`}
function ahHome(it,T){
  const TT=addUp(it.map(x=>x.v))||1,s=ahStyle();
  if(s==='stack')return `${ahHead(T)}<div class="ahStack">${it.map(x=>`<i style="width:${(x.v/TT*100).toFixed(2)}%;background:${x.c}"></i>`).join('')}</div>${ahLegend(it,T)}`;
  if(s==='rows')return `${ahHead(T)}<ul class="ahRows">${it.map(x=>`<li><div class="ahNml"><i style="background:${x.c}"></i><span>${esc(nm(x.cat))}</span></div><div class="ahBrow"><div class="ahTrack"><i style="width:${(x.v/TT*100).toFixed(1)}%;background:${x.c}"></i></div><b${ahNeg(x)}>${ahSign(x)}${M(x.v)}</b><em>${pct(x.v,T)}</em></div></li>`).join('')}</ul>`;
  if(s==='semi')return `<div class="ahSemi">${ahSemiSVG(it)}<div class="ahCtr"><span>${t(adj()?'costT':'net')}</span><b>${M(adj()?costT():T)}</b></div></div>${ahLegend(it,T)}`;
  const sorted=[...it].sort((a,b)=>b.v-a.v),big=sorted[0],rest=sorted.slice(1);
  const tl=(x,cls)=>`<div class="ahTile${cls}" style="background:${x.c};color:${ahInk(x.c)}"><small>${esc(nm(x.cat))}</small><div><b>${ahSign(x)}${M(x.v)}</b><small>${pct(x.v,T)} ${t('ah_of')}</small></div></div>`;
  return `${ahHead(T)}<div class="ahTiles">${tl(big,' big')}<div class="ahCol">${rest.map(x=>tl(x,'')).join('')}</div></div>`;
}

function fxStats(){
  const ms=fxLastMonths(12).map(fxMonth),act=ms.filter(m=>m.i||m.e),n=act.length||1;
  const inc=addUp(act.map(m=>m.i)),exp=addUp(act.map(m=>m.e));
  const A=FX.al.filter(a=>a.kind==='asset'),D=FX.al.filter(a=>a.kind==='debt');
  const cash=fxWallets(),hold=fxHold(),oth=addUp(A.map(a=>fxN(a.value))),debt=addUp(D.map(a=>fxN(a.value))),pay=addUp(D.map(a=>fxN(a.pay)));
  const assets=cash+hold+oth;
  return{months:act.length,avgIn:inc/n,avgEx:exp/n,inc,exp,cash,hold,oth,debt,pay,assets,net:assets-debt};
}
function fxRatios(s){
  const R=[],add=(name,val,txt,lvl,good)=>R.push({name,val,txt:val==null?'—':txt(val),lvl:val==null?null:lvl(val),good});
  const goal=Math.max(.1,fxN(FX.hc.goal)/100);
  add(vt('สภาพคล่อง (เงินสำรอง)','Liquidity (emergency fund)'),s.avgEx>0?s.cash/s.avgEx:null,v=>v.toFixed(1)+vt(' เดือน',' mo'),v=>v>=6?'g':v>=3?'y':'r',vt('เงินในกระเป๋า ÷ รายจ่ายต่อเดือน ควร ≥ 6 เดือน','Cash ÷ monthly spending, aim ≥ 6 months'));
  add(vt('หนี้สินต่อทรัพย์สิน','Debt to assets'),s.assets>0?s.debt/s.assets:(s.debt>0?null:0),fxPct,v=>v<=.4?'g':v<=.5?'y':'r',vt('หนี้สิน ÷ ทรัพย์สินรวม ควร ≤ 50%','Debt ÷ total assets, aim ≤ 50%'));
  add(vt('ภาระผ่อนต่อรายได้','Debt service ratio'),s.avgIn>0?s.pay/s.avgIn:(s.pay>0?null:0),fxPct,v=>v<=.35?'g':v<=.45?'y':'r',vt('ค่าผ่อนต่อเดือน ÷ รายได้ต่อเดือน ควร ≤ 35–40%','Monthly payments ÷ income, aim ≤ 35–40%'));
  add(vt('อัตราการออม','Savings rate'),s.inc>0?(s.inc-s.exp)/s.inc:null,fxPct,v=>v>=goal?'g':v>=0?'y':'r',vt('(รายรับ − รายจ่าย) ÷ รายรับ ควร ≥ ','(Income − spending) ÷ income, aim ≥ ')+fxPct(goal));
  add(vt('สินทรัพย์ลงทุนต่อความมั่งคั่งสุทธิ','Invested assets to net worth'),s.net>0?s.hold/s.net:null,fxPct,v=>v>=.5?'g':v>=.25?'y':'r',vt('ทรัพย์สินลงทุน ÷ มูลค่าสุทธิ ควร ≥ 50%','Invested ÷ net worth, aim ≥ 50%'));
  return R;
}
function fxScore(R){const p={g:100,y:60,r:20},v=R.filter(r=>r.lvl).map(r=>p[r.lvl]);return v.length?Math.round(addUp(v)/v.length):null}
function fxScoreTxt(sc){return sc==null?vt('ยังมีข้อมูลไม่พอ ลองบันทึกรายรับรายจ่ายก่อน','Not enough data yet'):sc>=75?vt('สุขภาพการเงินดี','Healthy'):sc>=50?vt('พอใช้ ควรปรับบางจุด','Fair, some areas to improve'):vt('ควรปรับปรุง','Needs attention')}
function fxGauge(score){
  const pt=(a,r)=>{const t=Math.PI*(1-a/100);return[(50+r*Math.cos(t)).toFixed(2),(50-r*Math.sin(t)).toFixed(2)]};
  const arc=(a0,a1,col)=>{const[x0,y0]=pt(a0,40),[x1,y1]=pt(a1,40);return `<path d="M${x0} ${y0} A40 40 0 0 1 ${x1} ${y1}" fill="none" stroke="${col}" stroke-width="10"/>`};
  let nd='';if(score!=null){const[nx,ny]=pt(Math.max(0,Math.min(100,score)),31);nd=`<line x1="50" y1="50" x2="${nx}" y2="${ny}" stroke="var(--txt)" stroke-width="2.6" stroke-linecap="round"/><circle cx="50" cy="50" r="3.6" fill="var(--txt)"/>`}
  return `<svg class="fxG" viewBox="0 0 100 56" role="img" aria-label="${vt('คะแนนสุขภาพการเงิน','Financial health score')}">${arc(0,49.4,'#d9534f')}${arc(50.6,74.4,'#e9b23b')}${arc(75.6,100,'#2f9e6a')}${nd}</svg>`;
}

function fxPositions(){const P={};FX.inv.forEach(x=>{if(x.status!=='done')return;const k=(x.name||'').trim();if(!k)return;const p=P[k]||(P[k]={name:k,cat:x.cat,cost:0});p.cost+=(x.side==='sell'?-1:1)*fxN(x.amt);p.cat=x.cat});
  return Object.values(P).filter(p=>p.cost>0.004).map(p=>({...p,mkt:FX.mkt[p.name]!=null&&FX.mkt[p.name]!==''?fxN(FX.mkt[p.name]):p.cost})).sort((a,b)=>b.mkt-a.mkt)}
function fxCVM(ps){
  const rows=Object.keys(FXC).map(c=>{const a=ps.filter(p=>p.cat===c);return{c,cost:addUp(a.map(p=>p.cost)),mkt:addUp(a.map(p=>p.mkt))}}).filter(r=>r.cost||r.mkt);
  const tc=addUp(rows.map(r=>r.cost)),tm=addUp(rows.map(r=>r.mkt)),g=tm-tc,mx=Math.max(1,...rows.map(r=>Math.max(r.cost,r.mkt)));
  const kpi=`<div class="fxKpi"><div><span>${vt('ต้นทุนรวม','Invested')}</span><b>${M(tc)}</b></div><div><span>${vt('มูลค่าตลาด','Market value')}</span><b>${M(tm)}</b></div><div style="grid-column:1/-1"><span>${vt('กำไร/ขาดทุน','Gain / loss')}</span><b class="${g>=0?'fxUp':'fxDn'}">${g>=0?'+':'−'}${M(Math.abs(g))} (${tc?(g/tc*100).toFixed(1):'0.0'}%)</b></div></div>`;
  if(!rows.length)return kpi+`<p class="fxEmpty">${vt('ยังไม่มีรายการซื้อที่สำเร็จ','No completed buys yet')}</p>`;
  return kpi+rows.map(r=>`<div class="fxBarG"><div class="fxBarL">${fxL2(FXC[r.c])}</div><div class="fxBar"><i style="width:${(Math.max(0,r.cost)/mx*100).toFixed(1)}%;background:var(--c2)"></i></div><div class="fxBar"><i style="width:${(Math.max(0,r.mkt)/mx*100).toFixed(1)}%;background:var(--c1)"></i></div></div>`).join('')+`<div class="fxLeg"><span><i style="background:var(--c2)"></i>${vt('ต้นทุน','Cost')}</span><span><i style="background:var(--c1)"></i>${vt('มูลค่าตลาด','Market value')}</span></div>`;
}

/* ---------- annual report ---------- */
function fxLine(vals,goal){
  const W=300,H=130,pl=30,pr=6,pt=10,pb=18,ok=vals.filter(v=>v!=null);
  const lo=Math.min(0,...ok.map(v=>Math.max(-100,v))),hi=Math.max(goal,10,...ok.map(v=>Math.min(100,v)));
  const x=i=>pl+i*(W-pl-pr)/11,y=v=>pt+(hi-Math.max(lo,Math.min(hi,v)))/((hi-lo)||1)*(H-pt-pb);
  let segs=[],cur=[];vals.forEach((v,i)=>{if(v==null){if(cur.length)segs.push(cur);cur=[]}else cur.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`)});if(cur.length)segs.push(cur);
  const mn=fxMonthsTH(),grid=[hi,goal,0,lo].filter((v,i,a)=>a.indexOf(v)===i);
  return `<svg class="fxLine" viewBox="0 0 ${W} ${H}" role="img" aria-label="${vt('อัตราการออมรายเดือน','Monthly savings rate')}">`+
   grid.map(g=>`<line x1="${pl}" x2="${W-pr}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="${g===goal?'var(--up)':'var(--line)'}" stroke-width="${g===goal?1.2:1}" ${g===goal?'stroke-dasharray="4 3"':''}/><text x="${pl-4}" y="${(y(g)+3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--mut)">${Math.round(g)}%</text>`).join('')+
   segs.map(s=>`<polyline points="${s.join(' ')}" fill="none" stroke="var(--c1)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`).join('')+
   vals.map((v,i)=>v==null?'':`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="var(--card)" stroke="var(--c1)" stroke-width="1.6"/>`).join('')+
   mn.map((m,i)=>i%2===0?`<text x="${x(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="8" fill="var(--mut)">${m}</text>`:'').join('')+`</svg>`;
}

/* ---- VIP: month navigation + statement import ---- */
let vipOff=0,vipRows=[];
const vipYM=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+vipOff);return d.getFullYear()+'-'+pad2(d.getMonth()+1)};
const VIP_CATS=['c_food','c_drink','c_trip','c_shop','c_home','c_util','c_health','c_fun','c_digital','c_other','c_salary','c_bonus','c_div','c_oin'];
const STM_PROMPT=`Extract EVERY transaction from this bank/e-wallet statement. Return ONLY a JSON array (no prose). Each item:
{"date":"YYYY-MM-DD" (Gregorian; convert Buddhist years by subtracting 543),"desc":"short merchant or description","amt":positive number without commas,"type":"ex" for money out / payments / withdrawals, "in" for money in / deposits / salary / refunds,"cat":one of ${JSON.stringify(VIP_CATS)}}

function vipValid(r){

  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!(a>0))return null;

async function vipReadStatement(files){
  const msg=m=>{const e=$('vipStMsg');if(e)e.textContent=m};
  const sample=await((window.claude&&typeof window.claude.use==='function')?window.claude.use('sample').catch(()=>null):Promise.resolve(null));
  if(!sample){msg(vt('ยังไม่ได้อนุญาตการอ่านด้วย Claude ในหน้านี้','Claude reading is not available in this view'));return}
  const lim=await sample.limits().catch(()=>null);
  const imgs=files.filter(f=>/^image\//.test(f.type)),txts=files.filter(f=>!/^image\//.test(f.type));
  const lines=[];for(const f of txts){(await f.text()).split(/\r?\n/).forEach(l=>{if(l.trim())lines.push(l)})}
  const found=[];let fails=0;
  msg(vt('กำลังอ่าน…','Reading…'));
  try{
    for(let k=0;k<lines.length;k+=150){
      const chunk=lines.slice(k,k+150).join('\n');
      const res=await sample.json(STM_PROMPT+'\n\nTEXT:\n'+chunk,{modelTier:'default'});
      (Array.isArray(res)?res:(res&&res.transactions)||[]).forEach(r=>{const v=vipValid(r||{});v?found.push(v):fails++});
    }
    const per=Math.max(1,Math.min((lim&&lim.images&&lim.images.maxCount)||5,8));
    for(let k=0;k<imgs.length;k+=per){
      msg(vt('กำลังอ่านรูปที่ ','Reading image ')+(k+1)+'…');
      const ch=imgs.slice(k,k+per),blobs=ch;
      const res=await sample.json(STM_PROMPT,{images:blobs,modelTier:'default'});
      (Array.isArray(res)?res:(res&&res.transactions)||[]).forEach(r=>{const v=vipValid(r||{});v?found.push(v):fails++});
    }
  }catch(e){msg(e&&e.code==='rate_limited'?vt('ขอใช้งานบ่อยเกินไป รอสักครู่แล้วลองใหม่','Too many requests, try again shortly'):vt('อ่านสเตทเมนต์ไม่สำเร็จ','Could not read the statement'));if(!found.length)return}
  vipRows=found.sort((a,b)=>a.date<b.date?-1:1);
  if(vipRows.length){const d=vipRows[0].date,n=new Date();vipOff=(+d.slice(0,4)-n.getFullYear())*12+(+d.slice(5,7)-1-n.getMonth())}
  renderVipSt();renderVip();
  if(fails)toast(vt('ข้ามบางบรรทัดที่อ่านไม่ได้: '+fails,'Skipped '+fails+' unreadable lines'));
}
function vipImportRows(){
  const add=vipRows.filter(r=>r.sel&&!r.dup);if(!add.length)return;
  add.forEach(r=>{TXs.push({id:uid(),acc:vipAcc||ACCTS[0].id,type:r.type,amt:r.amt,cat:r.cat,note:r.note,date:r.date,time:''});if(r.note)MEMO[mkey(r.note)]=r.cat});SV('assetDash.memo',MEMO);

}
$('vipPrev').onclick=()=>{vipOff--;renderVip()};
$('vipNext').onclick=()=>{vipOff++;renderVip()};
const _viewBeforeVip=view;
view=function(v){_viewBeforeVip(v);if(v==='vip'){renderVip();renderVipSt();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab==='more'))}};
</script>

<script>
/* ===== wallets, transfers, date ranges, remembered payees ===== */
var ACCTS=LS('assetDash.accts',null);if(!Array.isArray(ACCTS)||!ACCTS.length)ACCTS=[{id:'a_main',name:'บัญชีหลัก',open:0}];
var MEMO=LS('assetDash.memo',{});if(!MEMO||typeof MEMO!=='object')MEMO={};
var aA='all',tAcc=null,tTo=null,vipR=null,vipAcc=null,accMngOpen=false;
var stR=LS('assetDash.strng',null);if(!stR||!stR.from||!stR.to)stR={from:today().slice(0,8)+'01',to:today()};
CATS.tf=[];
function saveAcc(){SV('assetDash.accts',ACCTS)}
function saveMemo(){SV('assetDash.memo',MEMO)}
function mkey(s){return String(s||'').toLowerCase().replace(/[0-9x*\-]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60)}
function accOf(x){return x.acc&&ACCTS.some(a=>a.id===x.acc)?x.acc:ACCTS[0].id}
function accName(id){const a=ACCTS.find(a=>a.id===id);return a?a.name:'—'}
function accBal(id){const a=ACCTS.find(a=>a.id===id);let b=a?(+a.open||0):0;
  TXs.forEach(x=>{if(x.type==='tf'){if(accOf(x)===id)b-=x.amt;if(x.to===id)b+=x.amt}else if(accOf(x)===id)b+=x.type==='in'?x.amt:-x.amt});return b}
function rangeOf(ym){const[y,m]=ym.split('-').map(Number);return{from:ym+'-01',to:ym+'-'+pad2(new Date(y,m,0).getDate())}}
function dayAdd(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)+1}
function dayList(a,b){const out=[];for(let d=a;d<=b&&out.length<62;d=dayAdd(d,1))out.push(d);return out}

  const f=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());return{from:f(s),to:f(e)}}

/* ---- report: any date range, trading in range ---- */
function renderVip(){
  if(!$('v-vip'))return;
  applyVipText();
  const ym=vipYM(),today0=today();
  const R=vipR||rangeOf(ym);
  const n=dayDiff(R.from,R.to);
  const pR=vipR?{to:dayAdd(R.from,-1),from:dayAdd(R.from,-n)}:rangeOf(prevYM(ym,1));
  const cur=sumsR(R.from,R.to),prev=sumsR(pR.from,pR.to);
  const elapsed=Math.max(1,dayDiff(R.from,R.to<today0?R.to:today0));
  $('vipLbl').textContent=vipR?fmtR(R.from,R.to):ymLbl(ym);
  $('vipFrom').value=R.from;$('vipTo').value=R.to;
  renderVipAcc();
  // net worth now and 30 days ago (whole portfolio)
  const net=netT();
  const h=LS('assetDash.nwh',{}),ks=Object.keys(h).sort();
  const d30=new Date(Date.now()-30*864e5),k30=d30.getFullYear()+'-'+pad2(d30.getMonth()+1)+'-'+pad2(d30.getDate());
  const bk=ks.filter(k=>k<=k30).pop()||ks[0];
  const diff=bk?net-h[bk]:null,dp=bk&&h[bk]?diff/Math.abs(h[bk])*100:null;
  $('vipHero').innerHTML=`<div class="mut text-sm">${vt('มูลค่าสุทธิ (ตามราคาตลาด)','Net worth (market value)')}</div>
    <div class="text-3xl font-bold mt-1">${M(net)}</div>
    <div class="text-sm mt-2" style="color:${diff==null?'var(--mut)':diff>=0?'var(--up)':'var(--down)'}">${diff==null?vt('จะแสดงการเปลี่ยนแปลงเมื่อมีข้อมูลย้อนหลัง','Change appears once history exists'):`${diff>=0?'+':'−'}${M(Math.abs(diff))} (${(dp>=0?'+':'')+dp.toFixed(1)}%) · ${vt('ใน 30 วัน','last 30 days')}`}</div>`;
  const save=cur.I>0?(cur.I-cur.E)/cur.I*100:null;
  const chg=prev.E>0?(cur.E-prev.E)/prev.E*100:null;
  const trDays=Object.entries(TRADE.days||{}).filter(([d,x])=>x&&typeof x.pl==='number'&&d>=R.from&&d<=R.to);
  const trTotal=addUp(trDays.map(([,x])=>x.pl));
  $('vipKpi').innerHTML=[
    vipKpi(vt('อัตราการออม','Savings rate'),save==null?'—':save.toFixed(0)+'%',vt('จากรายรับในช่วงนี้','of income in range'),save!=null&&save>=0?'var(--up)':'var(--down)'),
    vipKpi(vt('ใช้เฉลี่ยต่อวัน','Avg spend / day'),M(cur.E/elapsed),vt('ในช่วงที่เลือก','in range')),
    vipKpi(vt('รายจ่ายเทียบช่วงก่อน','Spending vs before'),chg==null?'—':(chg>=0?'+':'−')+Math.abs(chg).toFixed(0)+'%',vt('ยิ่งต่ำยิ่งดี','lower is better'),chg!=null&&chg>0?'var(--down)':'var(--up)'),
    vipKpi(vt('กำไรเทรดในช่วง','Trading P&L in range'),(trTotal>=0?'+':'')+SM(trTotal),vt(trDays.length+' วันที่บันทึก',trDays.length+' logged days'),trTotal>=0?'var(--up)':'var(--down)')
  ].join('');
  // income vs expense
  const mx=Math.max(cur.I,cur.E,1);
  $('vipSum').innerHTML=`<h3 class="font-medium mb-3">${vt('สรุปช่วงนี้','Summary')}</h3>`+
    [[vt('รายรับ','Income'),cur.I,'var(--up)'],[vt('รายจ่าย','Expense'),cur.E,'var(--down)']].map(([l,v,c])=>`<div class="mb-3"><div class="flex justify-between text-sm"><span>${l}</span><b>${M(v)}</b></div><div style="height:10px;border-radius:99px;background:var(--soft2);overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:${(v/mx*100).toFixed(1)}%;border-radius:99px;background:${c}"></i></div></div>`).join('')+
    `<div class="flex justify-between text-sm pt-2" style="border-top:1px solid var(--line)"><span>${vt('คงเหลือ','Net')}</span><b style="color:${cur.I-cur.E>=0?'var(--up)':'var(--down)'}">${SM(cur.I-cur.E)}</b></div>`;
  // daily spending across the range
  const days=dayList(R.from,R.to),idx={};days.forEach((d,i)=>idx[d]=i);
  const daily=days.map(()=>0);cur.L.forEach(x=>{if(x.type==='ex'&&idx[x.date]!==undefined)daily[idx[x.date]]+=x.amt});
  const dmx=Math.max(1,...daily);
  $('vipDaily').innerHTML=`<h3 class="font-medium mb-3">${vt('รายจ่ายรายวัน','Daily spending')}</h3><div style="display:flex;align-items:flex-end;gap:${days.length>31?1:3}px;height:120px">${daily.map((v,i)=>`<i title="${days[i].slice(5)}: ${M(v)}" style="flex:1;min-width:2px;height:${v?Math.max(4,v/dmx*100):0}%;background:var(--c1);border-radius:3px 3px 0 0"></i>`).join('')}</div><div class="flex justify-between mut text-xs mt-1"><span>${days.length?days[0].slice(5):''}</span><span>${days.length?days[days.length-1].slice(5):''}</span></div>`;
  // top categories
  const byC={};cur.L.filter(x=>x.type==='ex').forEach(x=>byC[x.cat]=(byC[x.cat]||0)+x.amt);
  const rows=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,5),tot=addUp(Object.values(byC))||1;
  $('vipCat').innerHTML=`<h3 class="font-medium mb-3">${vt('หมวดรายจ่ายสูงสุด','Top expense categories')}</h3>`+(rows.length?
    rows.map(([c,v],i)=>`<div class="mb-3"><div class="flex justify-between text-sm"><span>${esc(t(c))}</span><b>${M(v)} <span class="mut">${pct(v,tot)}</span></b></div><div style="height:8px;border-radius:99px;background:var(--soft2);overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:${(v/tot*100).toFixed(1)}%;border-radius:99px;background:var(--c${(i%7)+1})"></i></div></div>`).join('')
    :`<p class="mut text-sm">${vt('ยังไม่มีรายจ่ายในช่วงนี้','No expenses in this range')}</p>`);
  // trading insights in range
  const sorted=trDays.slice().sort((a,b)=>a[0]<b[0]?1:-1);
  const wins=sorted.filter(([,x])=>x.pl>0).length,losses=sorted.filter(([,x])=>x.pl<0).length;
  const rate=wins+losses?wins/(wins+losses)*100:null;
  let streak=0;for(const [,x] of sorted){if(x.pl>0)streak++;else break}
  const best=sorted.reduce((b,e)=>!b||e[1].pl>b[1].pl?e:b,null),worst=sorted.reduce((b,e)=>!b||e[1].pl<b[1].pl?e:b,null);
  $('vipTr').innerHTML=`<h3 class="font-medium mb-3">${vt('สถิติการเทรด','Trading insights')}</h3>`+(sorted.length?
    `<div class="grid grid-cols-2 gap-3 text-sm">
      <div><div class="mut text-xs">${vt('อัตราชนะ','Win rate')}</div><b class="text-lg">${rate==null?'—':rate.toFixed(0)+'%'}</b></div>
      <div><div class="mut text-xs">${vt('วินนิ่งสตรีคล่าสุด','Latest win streak')}</div><b class="text-lg">${streak} ${vt('วัน','days')}</b></div>
      <div><div class="mut text-xs">${vt('วันกำไรดีที่สุด','Best day')}</div><b style="color:var(--up)">${SG(best[1].pl)}</b><div class="mut text-xs">${best[0]}</div></div>
      <div><div class="mut text-xs">${vt('วันขาดทุนหนักสุด','Worst day')}</div><b style="color:var(--down)">${SG(worst[1].pl)}</b><div class="mut text-xs">${worst[0]}</div></div>
    </div>`:`<p class="mut text-sm">${vt('ยังไม่มีการเทรดในช่วงนี้','No trades in this range')}</p>`);
}

<script>
/* ---- assets page: overview + readable category rows ---- */
function renderAssetOv(){
  const el=$('assetOv');if(!el)return;
  const cost=costT(),mkt=netT(),diff=mkt-cost,dp=cost?diff/Math.abs(cost)*100:0;
  const ym=today().slice(0,7),mo=sums(ym),wal=addUp(ACCTS.map(a=>accBal(a.id)));
  const tile=(l,v,s,c)=>`<div class="card p-4"><div class="mut text-xs">${l}</div><div class="text-xl font-bold mt-1" style="${c?'color:'+c:''}">${v}</div><div class="mut text-xs mt-1">${s||'&nbsp;'}</div></div>`;
  const net=mo.I-mo.E;
  el.innerHTML=`<div class="grid grid-cols-2 gap-3">
    ${tile(vt('มูลค่าสุทธิ','Net worth'),M(mkt),vt('ราคาตลาดตอนนี้','current market value'))}
    ${tile(vt('ต้นทุนรวม','Total cost'),M(cost),vt('เงินที่ลงทุนไป','amount invested'))}
    ${tile(vt('กำไร / ขาดทุน','Gain / loss'),(diff>=0?'+':'−')+M(Math.abs(diff)),(dp>=0?'+':'−')+Math.abs(dp).toFixed(1)+'%',diff>=0?'var(--up)':'var(--down)')}
    ${tile(vt('เงินในกระเป๋า','Cash in wallets'),M(wal),vt('เดือนนี้ ','This month ')+(net>=0?'+':'−')+M(Math.abs(net)),net>=0?'var(--up)':'var(--down)')}
  </div>`;
  decorateLegend();
}
let lgBusy=false;
function decorateLegend(){
  const L=$('legend');if(!L||lgBusy)return;
  const T=total()||1,byId=Object.fromEntries(data.map(c=>[c.id,c]));
  const btns=[...L.querySelectorAll('[data-sel]')].map(b=>({b,c:byId[b.dataset.sel]})).filter(x=>x.c);
  if(!btns.length)return;
  const want=[...btns].sort((a,b)=>sum(b.c)-sum(a.c)).map(x=>x.b);
  const same=want.every((b,i)=>L.children[i]===b);
  lgBusy=true;
  btns.forEach(({b,c})=>{
    if(b.dataset.dec==='1')return;
    const v=sum(c);b.dataset.dec='1';
    b.style.cssText='display:flex;width:100%;max-width:100%;min-width:0;box-sizing:border-box;justify-content:space-between;align-items:center;gap:10px;border-radius:16px;padding:10px 14px;text-align:left;white-space:normal';
    b.innerHTML=`<span style="display:flex;align-items:center;gap:8px;min-width:0;flex:1"><span class="dot" style="background:${cc(c)};flex:none"></span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nm(c))}</span></span><b style="white-space:nowrap;flex:none">${c.neg?'−':''}${M(v)} <span class="mut text-xs" style="font-weight:500">${pct(v,T)}</span></b>`;
  });
  if(!same)want.forEach(b=>L.appendChild(b));
  L.style.display='flex';L.style.flexDirection='column';L.style.gap='8px';L.style.alignItems='stretch';L.style.width='100%';L.style.minWidth='0';L.style.boxSizing='border-box';
  lgBusy=false;
}

/* v42: wallets synced with the "cash in accounts" asset category + app mode (all / ledger / invest) */
let CSYNC=LS('assetDash.cashSync',true)!==false,csBusy=false;
function cashCat(){return data.find(c=>c.k==='k_cash')||data.find(c=>/เงินสด|cash/i.test(nm(c)))}
function csTxNet(id){let b=0;TXs.forEach(x=>{if(x.type==='tf'){if(accOf(x)===id)b-=x.amt;if(x.to===id)b+=x.amt}else if(accOf(x)===id)b+=x.type==='in'?x.amt:-x.amt});return b}
function csUsed(id){return TXs.some(x=>x.acc===id||x.to===id)}
/* make the wallet list mirror the cash items; mode 'tx' = entries changed (items follow wallets), 'data' = assets edited (wallets follow items) */
function cashSync(mode){
  if(!CSYNC||csBusy)return false;const c=cashCat();if(!c)return false;csBusy=true;let dC=false,aC=false;
  try{
    /* pin entries that have no wallet to the main account before the wallet order changes */
    if(ACCTS.some(a=>a.id==='a_main')){let tc=false;TXs.forEach(x=>{if(!x.acc||!ACCTS.some(a=>a.id===x.acc)){x.acc=ACCTS[0].id;tc=true}});if(tc)saveT()}
    c.items.forEach(it=>{if(!it.id){it.id='i_'+uid();dC=true}
      let w=ACCTS.find(a=>a.link===it.id);
      if(!w){w=ACCTS.find(a=>!a.link&&!a.nolink&&a.id!=='a_main'&&a.name===nm(it));if(w){w.link=it.id;aC=true}}
      if(!w){w={id:'a_'+uid(),name:nm(it),open:0,link:it.id};ACCTS.push(w);w.open=(+it.amount||0)-csTxNet(w.id);aC=true;return}
      if(w.name!==nm(it)){w.name=nm(it);aC=true}
      const bal=accBal(w.id),amt=+it.amount||0;
      if(Math.abs(bal-amt)>0.004){if(mode!=='data'){it.amount=Math.round(bal*100)/100;dC=true}else{w.open=(+w.open||0)+(amt-bal);aC=true}}
    });
    /* wallets whose item was deleted: drop if unused, otherwise keep as a plain wallet */
    ACCTS=ACCTS.filter(a=>{if(a.link&&!c.items.some(it=>it.id===a.link)){aC=true;if(!csUsed(a.id))return false;delete a.link;a.nolink=1}return true});
    /* wallets added in the wallet manager become cash items */
    ACCTS.forEach(a=>{if(!a.link&&!a.nolink&&a.id!=='a_main'){const it={id:'i_'+uid(),name:a.name,amount:Math.round(accBal(a.id)*100)/100};c.items.push(it);a.link=it.id;aC=dC=true}});
    /* the default "main account" goes away once the cash accounts exist, unless entries already use it */
    const m=ACCTS.find(a=>a.id==='a_main');
    if(m&&ACCTS.some(a=>a.link)){if(!csUsed('a_main')&&!(+m.open)){ACCTS=ACCTS.filter(a=>a.id!=='a_main');aC=true}else if(!m.nolink){m.nolink=1;aC=true}}
    if(!ACCTS.length)ACCTS=[{id:'a_main',name:'บัญชีหลัก',open:0}];
    if(!localStorage.getItem('assetDash.accCustom')){const L=ACCTS.filter(a=>a.link),O=ACCTS.filter(a=>!a.link);const n=L.concat(O);if(n.some((a,i)=>a!==ACCTS[i])){ACCTS=n;aC=true}}
    if(aC)saveAcc();if(dC)save();
  }catch(e){console.error(e)}finally{csBusy=false}
  return aC||dC;
}
function csRefresh(){try{render()}catch(e){}try{renderT()}catch(e){}try{renderHomeCards()}catch(e){}}
(function(){const set=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){set.call(this,k,v);
  if(this!==window.localStorage||csBusy||!CSYNC)return;
  if(k==='assetDash.tx'||k==='assetDash.accts'){setTimeout(()=>{if(cashSync(k==='assetDash.tx'?'tx':'acc'))csRefresh()},0)}
  else if(k===KEY){setTimeout(()=>{if(cashSync('data'))csRefresh()},0)}}})();
/* in the health check, cash wallets are already inside the invested/held assets when synced */
fxWallets=function(){try{return addUp(ACCTS.map(a=>accBal(a.id)))}catch(e){return 0}};
const _fxStats0=fxStats;fxStats=function(){const s=_fxStats0();if(CSYNC&&cashCat()){const un=addUp(ACCTS.filter(a=>!a.link).map(a=>accBal(a.id)));s.assets=s.hold+s.oth+un;s.net=s.assets-s.debt}return s};

/* ---------- app mode ---------- */
const AM_HIDE={ledger:['assets','shift','inv','div','stocks'],invest:['act','stats','safe','goals']};
function amGet(){const m=LS('assetDash.appMode','all');return ['all','ledger','invest'].includes(m)?m:'all'}
function amApply(){const m=amGet();document.body.classList.toggle('mode-ledger',m==='ledger');document.body.classList.toggle('mode-invest',m==='invest');
  document.querySelectorAll('[data-amode]').forEach(b=>b.classList.toggle('on',b.dataset.amode===m));
  const sw=document.getElementById('csSw');if(sw)sw.checked=CSYNC;
  const v=document.body.dataset.view;if(AM_HIDE[m]&&AM_HIDE[m].includes(v))view('home')}
const _viewAM=view;view=function(v){const m=amGet();if(AM_HIDE[m]&&AM_HIDE[m].includes(v))v='home';_viewAM(v)};
Object.assign(TX.th,{amL:'โหมดแอป',am_all:'รวม',am_ledger:'รายรับรายจ่าย',am_invest:'ลงทุน',csL:'ซิงค์กระเป๋ากับหมวดเงินสด',csS:'รายรับรายจ่ายตัดยอดบัญชีเงินสดในทรัพย์สิน'});
Object.assign(TX.en,{amL:'App mode',am_all:'All',am_ledger:'Spending',am_invest:'Investing',csL:'Sync wallets with cash',csS:'Entries update the cash accounts in your assets'});
(function(){const anchor=document.querySelector('.stR.ahR');if(!anchor)return;
  const r=document.createElement('div');r.className='stR ahR';r.innerHTML='<span data-i18n="amL"></span><div class="segP ahSeg amSeg"><button data-amode="all" data-i18n="am_all"></button><button data-amode="ledger" data-i18n="am_ledger"></button><button data-amode="invest" data-i18n="am_invest"></button></div>';

  anchor.parentNode.insertBefore(s,anchor.nextSibling);

  L.innerHTML=`<label class="hSrc">${esc((heroSrcs().find(x=>x[0]===k)||[,''])[1])} ▾<select id="hSrcSel" aria-label="${vt('เลือกยอดที่แสดง','Choose what to show')}">${heroSrcs().map(([v,n])=>`<option value="${v}" ${v===k?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`;V.textContent=heroVal(k)};
['click','pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('.hSrc'))e.stopPropagation()},true));

/* v45: rename wallets (also renames the linked cash item) */
$('accSec').addEventListener('change',e=>{const i=e.target.closest('[data-aname]');if(!i)return;const n=i.value.trim().slice(0,30);const a=ACCTS.find(a=>a.id===i.dataset.aname);if(!a)return;if(!n){i.value=a.name;return}

<script>
(function(){

const RIP='.btn,.chipS,.pill,.mrow,.accC,.accRow button,.kp button,.segP button,.seg button';

 try{if(!hl){hl=document.createElement('label');hl.setAttribute('aria-hidden','true');hl.style.cssText='position:fixed;left:-99px;top:-99px;opacity:0;pointer-events:none';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');hl.appendChild(i);document.body.appendChild(hl)}hl.click()}catch(e){}}
window.haptic=haptic;/* press feedback + ripple */
let cur=null;
document.addEventListener('pointerdown',e=>{if(e.button>0||!e.target.closest)return;const t=e.target.closest(SEL);if(!t||t.disabled||t.closest('.hSrc,.dragH'))return;
 t.classList.add('px','pressed');cur=t;
 if(!RM&&t.matches(RIP)){const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,s=document.createElement('span');t.classList.add('rip');s.className='rpl';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(s);setTimeout(()=>s.remove(),600)}},{passive:true,capture:true});
['pointerup','pointercancel','dragstart'].forEach(ev=>window.addEventListener(ev,()=>{if(cur){cur.classList.remove('pressed');cur=null}},{passive:true,capture:true}));

 if(!e.isTrusted||!e.target.closest)return;const t=e.target.closest(SEL);if(!t||t.closest('.hSrc,.dragH'))return;haptic(t.matches('.fabM,.btn-p')?14:t.matches('.tab')?9:6)},true);

 const pt=TABS.includes(prev),nt=TABS.includes(v);el.classList.remove('vIn','fromR','fromL');void el.offsetWidth;el.classList.add('vIn');
 if(pt&&!nt)el.classList.add('fromR');else if(!pt&&nt)el.classList.add('fromL');else if(pt&&nt&&TABS.indexOf(v)<TABS.indexOf(prev))el.classList.add('fromL');else if(pt&&nt)el.classList.add('fromR');
